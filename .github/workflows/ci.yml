name: Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ['22', '24.21.0']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        run: |
          mkdir -p test-results
          node --test --test-reporter=spec --test-reporter=junit \
            --test-reporter-destination=stdout --test-reporter-destination=test-results/unit.xml test/*.test.mjs
      - name: Prepare unit test summary
        if: always()
        run: |
          python - <<'PY_SUMMARY'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('test-results/unit.xml')
          if report.is_file():
              cases = list(ET.parse(report).getroot().iter('testcase'))
              summary = {'suite': 'unit', 'revision': os.environ['GITHUB_SHA'], 'tests': len(cases)}
              summary.update({name: sum(case.find(tag) is not None for case in cases)
                              for name, tag in [('failures', 'failure'), ('errors', 'error'), ('skipped', 'skipped')]})
              Path('test-results/unit-summary.json').write_text(json.dumps(summary) + '\n')
          PY_SUMMARY
      - name: Retain unit test summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-node-${{ matrix.node }}
          path: test-results/unit-summary.json
          retention-days: 7
          if-no-files-found: warn
      - run: npm audit --omit=dev --audit-level=high
      - name: Container startup
        if: matrix.node == '24.21.0'
        run: |
          docker build -t reliquary-mcp:test .
          docker run --name mcp-smoke -d --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            -e RELIQUARY_TRANSPORT=http -e RELIQUARY_MCP_TOKEN=container_test_token_00000000000000 reliquary-mcp:test
          trap 'docker rm -f mcp-smoke >/dev/null' EXIT
          for attempt in $(seq 1 20); do
            if docker exec mcp-smoke node -e "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"; then exit 0; fi
            sleep 1
          done
          exit 1
